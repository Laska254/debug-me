<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta
            name="description"
            content="debug-me: an interactive 3D resume. Walk inside the JVM and debug your way through my Java skills."
        />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <title>debug-me</title>
    </head>
    <body>
        <noscript>debug-me is a 3D game and needs JavaScript enabled.</noscript>
        <div id="app"></div>
        <button id="overlay" class="overlay" type="button" hidden>
            <span class="overlay-title">Click to play</span>
            <span class="overlay-hint">WASD or arrows to move, mouse to look, Shift to walk faster, Esc to pause</span>
        </button>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
